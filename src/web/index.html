<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Panel Termux — turn an Android phone into a server</title>
    <meta name="description" content="Web panel that turns an Android phone with Termux into a server for single-binary Bun apps: monitoring, deploys, backups and domains via Cloudflare Tunnel." />
    <meta name="theme-color" content="#fdfcf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0b09" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <!-- Theme boot (before CSS paints, no flash). Mirrors web/theme/theme.preference.ts: key, values, colours. -->
    <script>
      (() => {
        let pref = "system";
        try {
          pref = localStorage.getItem("panel-termux:theme") || "system";
        } catch {
          pref = "system"; // storage blocked: follow the OS
        }
        const dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (pref === "system") return;
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          meta.setAttribute("content", dark ? "#0f0b09" : "#fdfcf9");
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
