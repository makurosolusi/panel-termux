# drizzle/migrations.js imports .sql files; load them as text so they are embedded in the binary.
[loader]
".sql" = "text"

[serve.static]
plugins = ["bun-plugin-tailwind"]

# Reset module-wide CLI state before and after every test (tests/cli.locale.preload.ts).
[test]
preload = ["./tests/cli.locale.preload.ts"]
