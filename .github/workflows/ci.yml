# Same gate as release.yml (PLAN/04 §3.9.3) on every push to main and every pull request, so a Linux-only failure
# shows up before a tag. Read-only token; every action pinned to a full commit SHA (tag in the trailing comment).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Shell tests
        run: sh scripts/install-phone.test.sh && sh scripts/install-release.test.sh && sh scripts/package-release.test.sh
      - run: bun run build
      # scripts/bundle-report.ts (bundle budget, PLAN/01 §6) is added in wave W4; until then this step is a no-op.
      - name: Bundle budget
        run: |
          if [ -f scripts/bundle-report.ts ]; then bun run bundle:check; else echo "scripts/bundle-report.ts not present yet"; fi
