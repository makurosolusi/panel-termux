# Builds and publishes a release. Tag pushes (v*) publish; a manual run defaults to a dry run that builds and packages
# but never attests or creates a release. A green dry run is required before the owner pushes the tag (DECISIONS B9).
# Security gate: PLAN/04 §3.9.3. Every action is pinned to a full commit SHA (tag in the trailing comment).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only (no attestation, no GitHub release)"
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
      id-token: write # Sigstore signing for actions/attest
      attestations: write # store the attestation
      artifact-metadata: write # storage record written by actions/attest v4
    env:
      # Publish only for a tag ref, and never when a manual run asked for a dry run.
      PUBLISH: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      DISPATCH_PUBLISH_FROM_BRANCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_type != 'tag' }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Refuse to publish from a branch
        if: env.DISPATCH_PUBLISH_FROM_BRANCH == 'true'
        run: |
          echo "::error::dry_run=false needs a tag ref; push the tag v<version> instead"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true # no actions/cache in the release path (cache poisoning)

      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Shell tests
        run: sh scripts/install-phone.test.sh && sh scripts/install-release.test.sh && sh scripts/package-release.test.sh

      - name: Version gate (tag = package.json version, CHANGELOG entry)
        run: |
          VERSION=$(jq -r .version package.json)
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$VERSION]' entry"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then TAG=$REF_NAME; else TAG=v0.0.0-dryrun; fi
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          echo "TAG=$TAG" >>"$GITHUB_ENV"

      - run: bun run build
      - name: Package
        run: |
          sh scripts/package-release.sh dist/panel-android-arm64 dist/release "$TAG"
          { echo '```'; ls -l dist/release; cat dist/release/SHA256SUMS; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      # Attestations need a public repo (or a paid plan). Verify: gh attestation verify <asset> --repo <owner>/<repo>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-checksums: dist/release/SHA256SUMS

      - name: Create GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md >notes.md
          gh release create "$TAG" dist/release/* --verify-tag --title "$TAG" --notes-file notes.md
